name: Update UniStore

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-unistore:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest release info
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            core.setOutput('tag', release.data.tag_name);
            core.setOutput('date', release.data.published_at.split('T')[0]);

      - name: Update unistore version and date
        run: |
          VERSION="${{ steps.release.outputs.tag }}"
          DATE="${{ steps.release.outputs.date }}"

          # Strip leading 'v' if present (e.g. v1.0.0 -> 1.0.0)
          VERSION="${VERSION#v}"

          # Bump the revision counter so Universal-Updater detects the change
          CURRENT_REVISION=$(jq '.storeInfo.revision' Balatro3DS.unistore)
          NEW_REVISION=$((CURRENT_REVISION + 1))

          jq \
            --arg ver "$VERSION" \
            --arg date "$DATE" \
            --argjson rev "$NEW_REVISION" \
            '
              .storeInfo.revision = $rev |
              .storeContent[0].info.version = $ver |
              .storeContent[0].info.lastUpdated = $date
            ' \
            Balatro3DS.unistore > Balatro3DS.unistore.tmp

          mv Balatro3DS.unistore.tmp Balatro3DS.unistore

      - name: Commit and push updated unistore
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Balatro3DS.unistore
          git diff --cached --quiet || git commit -m "chore: update unistore to ${{ steps.release.outputs.tag }}"
          git push
